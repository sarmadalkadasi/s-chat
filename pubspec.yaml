name: s_chat
description: "A secure, end-to-end encrypted Flutter chat app powered by Supabase."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.2.4
  supabase_flutter: ^2.18.3
  intl: ^0.20.3
  flutter_local_notifications: ^22.0.1
  path_provider: ^2.1.2
  sticky_headers: ^0.3.0+2
  file_picker: ^13.1.0
  record: ^6.2.1
  audioplayers: ^6.7.1
  vector_math: ^2.1.4
  cryptography: ^2.9.0
  flutter_secure_storage: ^11.2.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/img/s_chat.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/img/s_chat.png"
  windows:
    generate: true
    image_path: "assets/img/s_chat.png"

flutter_native_splash:
  color: "#075E54"
  image: "assets/img/s_chat.png"
  android_12:
    image: "assets/img/s_chat.png"
    color: "#075E54"

flutter:
  uses-material-design: true

  assets:
    - assets/img/s_chat.png

  fonts:
    - family: Audiowide
      fonts:
        - asset: assets/fonts/Audiowide-Regular.ttf
