name: s_chat
description: "A secure, end-to-end encrypted Flutter chat app powered by Supabase."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.2.4
  supabase_flutter: ^2.18.3
  intl: ^0.20.3
  flutter_local_notifications: ^22.0.1
  path_provider: ^2.1.2
  sticky_headers: ^0.3.0+2
  file_picker: ^13.1.0
  record: ^6.2.1
  audioplayers: ^6.7.1
  vector_math: ^2.1.4
  cryptography: ^2.9.0
  flutter_secure_storage: ^11.2.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_native_splash:
  # Light mode
  color: "#FFFFFF"
  image: assets/img/s_chat.png
  # Dark mode
  color_dark: "#121B22"
  image_dark: assets/img/s_chat.png

  android: true
  ios: true
  web: false

  android_12:
    color: "#FFFFFF"
    image: assets/img/s_chat_splash.png
    icon_background_color: "#FFFFFF"
    color_dark: "#121B22"
    image_dark: assets/img/s_chat_splash.png
    icon_background_color_dark: "#121B22"

flutter:
  uses-material-design: true

  assets:
    - assets/img/s_chat.png

  fonts:
    - family: Audiowide
      fonts:
        - asset: assets/fonts/Audiowide-Regular.ttf
